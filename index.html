<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Sway Test - a guided, read-aloud subconscious rewiring session in English, French, and Spanish.">
<title>The Sway Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=Pinyon+Script&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
  :root{
    --cream:#fff8ef; --card:#fffdf8; --ink:#2b1a1e; --ink-soft:#5c4a4b;
    --burgundy:#800020; --forest:#366049; --forest-deep:#2a4c3a;
    --sage:#729377; --gold:#c6a664; --gold-soft:#e9d9b8; --line:#e8dcc8;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:'Montserrat',Verdana,sans-serif; font-size:16px; line-height:1.6;
    min-height:100vh;
  }
  .wrap{max-width:680px; margin:0 auto; padding:40px 20px 140px}
  /* ---------- header ---------- */
  header{text-align:center; margin-bottom:34px}
  .script-accent{
    font-family:'Pinyon Script',cursive; color:var(--gold); font-size:44px; line-height:1;
    display:block; margin-bottom:2px;
  }
  h1{
    font-family:'Playfair Display',Georgia,serif; font-weight:900; color:var(--burgundy);
    font-size:clamp(30px,6vw,44px); margin:0 0 10px; letter-spacing:.01em; text-wrap:balance;
  }
  .tagline{
    text-transform:uppercase; letter-spacing:.18em; font-size:12px; font-weight:600; color:var(--forest);
  }
  /* ---------- phase chips ---------- */
  .phases{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:26px 0 30px}
  .phase{
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    border-radius:999px; padding:7px 14px; font-size:12px; font-weight:600;
    text-transform:uppercase; letter-spacing:.08em; cursor:pointer; font-family:inherit;
  }
  .phase:hover{border-color:var(--sage)}
  .phase.active{background:var(--forest); border-color:var(--forest); color:var(--cream)}
  .phase.done{color:var(--forest); border-color:var(--sage)}
  .phase:focus-visible,button:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
  /* ---------- setup card ---------- */
  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:26px 26px 22px; margin-bottom:22px;
  }
  .panel h2{
    font-family:'Playfair Display',Georgia,serif; color:var(--burgundy); font-weight:700;
    font-size:21px; margin:0 0 12px;
  }
  .panel p{margin:0 0 14px; color:var(--ink-soft); font-size:15px}
  .field{margin-bottom:16px}
  .field label{
    display:block; font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:.14em; color:var(--forest); margin-bottom:6px;
  }
  select,input[type=range]{width:100%}
  select{
    font-family:inherit; font-size:14px; padding:10px 12px; color:var(--ink);
    background:var(--cream); border:1px solid var(--line); border-radius:10px;
  }
  input[type=range]{accent-color:var(--forest)}
  .range-row{display:flex; align-items:center; gap:12px}
  .range-val{font-size:13px; font-weight:600; color:var(--ink-soft); min-width:52px; text-align:right; font-variant-numeric:tabular-nums}
  /* ---------- speaking stage ---------- */
  .stage{
    background:var(--card); border:1px solid var(--gold-soft);
    border-radius:260px 260px 22px 22px;
    padding:74px 30px 40px; text-align:center; min-height:330px;
    display:flex; flex-direction:column; justify-content:center; gap:18px;
    box-shadow:0 1px 0 var(--gold-soft), 0 14px 40px -28px rgba(128,0,32,.35);
  }
  .stage-label{
    text-transform:uppercase; letter-spacing:.2em; font-size:11px; font-weight:700; color:var(--gold);
  }
  .spoken{
    font-family:'Playfair Display',Georgia,serif; font-weight:500; color:var(--ink);
    font-size:clamp(21px,4.5vw,28px); line-height:1.45; text-wrap:balance; margin:0;
  }
  .stage-sub{font-size:13px; color:var(--ink-soft)}
  .breath{
    width:14px; height:14px; border-radius:50%; background:var(--sage); margin:0 auto; opacity:.85;
  }
  @media (prefers-reduced-motion: no-preference){
    .breath.live{animation:breathe 6s ease-in-out infinite}
    @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(2.1)}}
  }
  /* ---------- recap ---------- */
  #recap{margin-top:22px}
  .recap-row{display:flex; gap:12px; align-items:center; padding:10px 2px; border-bottom:1px solid var(--line); cursor:pointer; user-select:none}
  .recap-row:last-child{border-bottom:none}
  .recap-row .num{color:var(--gold); font-weight:700; font-variant-numeric:tabular-nums; min-width:24px; text-align:right}
  .recap-row .txt{flex:1; font-size:14.5px; color:var(--ink)}
  .recap-state{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; border-radius:999px; padding:6px 12px; white-space:nowrap; border:2px solid transparent}
  .recap-state.yes{background:#36604914; color:var(--forest); border-color:var(--sage)}
  .recap-state.no{background:#80002012; color:var(--burgundy); border-color:var(--burgundy)}
  /* ---------- buttons / choice / progress ---------- */
  .btn{
    font-family:inherit; font-weight:700; font-size:14px; letter-spacing:.04em;
    border-radius:999px; padding:13px 24px; cursor:pointer; border:2px solid transparent;
  }
  .btn-yes{background:var(--forest); color:var(--cream); border-color:var(--forest)}
  .btn-yes:hover{background:var(--forest-deep)}
  .btn-no{background:transparent; color:var(--burgundy); border-color:var(--burgundy)}
  .btn-no:hover{background:#80002012}
  .btn-quiet{background:transparent; color:var(--ink-soft); border-color:var(--line)}
  .choice{display:none; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:4px}
  .choice.show{display:flex}
  .progress{margin:18px 4px 0; display:none}
  .progress.show{display:block}
  .progress-track{height:5px; background:var(--line); border-radius:99px; overflow:hidden}
  .progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--gold),var(--forest)); border-radius:99px; transition:width .4s}
  .progress-text{font-size:12px; color:var(--ink-soft); margin-top:7px; text-align:center; letter-spacing:.06em}
  /* ---------- control bar ---------- */
  .controls{
    position:fixed; left:0; right:0; bottom:0; background:var(--forest-deep);
    border-top:3px solid var(--gold); padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .controls-inner{max-width:680px; margin:0 auto; display:flex; gap:10px; align-items:center; justify-content:center}
  .ctl{
    font-family:inherit; font-weight:700; border:none; cursor:pointer; border-radius:999px;
    background:#ffffff14; color:var(--cream); padding:12px 18px; font-size:14px;
  }
  .ctl:hover{background:#ffffff26}
  .ctl-main{background:var(--gold); color:var(--ink); padding:14px 34px; font-size:15px; letter-spacing:.04em}
  .ctl-main:hover{background:#d4b878}
  .ctl[disabled]{opacity:.4; cursor:default}
  /* ---------- full script ---------- */
  details{margin-top:30px; border:1px solid var(--line); border-radius:14px; background:var(--card); padding:18px 22px}
  summary{
    cursor:pointer; font-weight:700; color:var(--forest); font-size:14px;
    text-transform:uppercase; letter-spacing:.1em;
  }
  .belief-cat{
    font-family:'Playfair Display',Georgia,serif; color:var(--burgundy); font-weight:700;
    font-size:18px; margin:22px 0 8px;
  }
  .belief{border-bottom:1px solid var(--line); padding:10px 0; font-size:14px}
  .belief:last-child{border-bottom:none}
  .belief .t{color:var(--ink)}
  .belief .r{color:var(--forest); margin-top:3px}
  .belief .n{color:var(--gold); font-weight:700; margin-right:8px; font-variant-numeric:tabular-nums}
  .note{font-size:12.5px; color:var(--ink-soft); text-align:center; margin-top:26px}
  .hint{font-size:12.5px; color:var(--ink-soft)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="script-accent">rewired</span>
    <h1>The Sway Test</h1>
    <div class="tagline" id="tagline"></div>
  </header>

  <div class="phases" id="phases"></div>

  <div class="panel" id="setup">
    <h2 id="setupTitle"></h2>
    <p id="setupDesc"></p>
    <div class="field">
      <label for="langSel" id="lblLang"></label>
      <select id="langSel">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
      </select>
    </div>
    <div class="field">
      <label for="voice" id="lblVoice"></label>
      <select id="voice"></select>
      <div style="margin-top:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap">
        <button class="btn btn-quiet" id="testVoice" type="button"></button>
        <span class="hint" id="soundHint"></span>
      </div>
    </div>
    <div class="field">
      <label for="rate" id="lblRate"></label>
      <div class="range-row">
        <input type="range" id="rate" min="0.6" max="1.15" step="0.05" value="0.85">
        <span class="range-val" id="rateVal">0.85×</span>
      </div>
    </div>
    <div class="field">
      <label for="hold" id="lblHold"></label>
      <div class="range-row">
        <input type="range" id="hold" min="3" max="15" step="1" value="6">
        <span class="range-val" id="holdVal">6 s</span>
      </div>
    </div>
  </div>

  <div class="stage" id="stage" aria-live="polite">
    <div class="stage-label" id="stageLabel"></div>
    <p class="spoken" id="spoken"></p>
    <div class="breath" id="breath" hidden></div>
    <div class="stage-sub" id="stageSub"></div>
    <div class="choice" id="choice"></div>
  </div>

  <div class="panel" id="recap" hidden>
    <h2 id="recapTitle"></h2>
    <p id="recapHint"></p>
    <div id="recapList"></div>
    <div style="text-align:center; margin-top:18px"><button class="btn btn-yes" id="recapDone"></button></div>
  </div>

  <div class="progress" id="progress">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText"></div>
  </div>

  <details>
    <summary id="sumBeliefs"></summary>
    <div id="beliefList"></div>
  </details>
  <p class="note" id="pageNote"></p>
</div>

<div class="controls">
  <div class="controls-inner">
    <button class="ctl" id="btnBack" disabled>&#8249;</button>
    <button class="ctl ctl-main" id="btnMain"></button>
    <button class="ctl" id="btnNext" disabled>&#8250;</button>
  </div>
</div>

/* ================= state ================= */
const $ = id => document.getElementById(id);
const prefs = (() => { try { return JSON.parse(localStorage.getItem('rewire-prefs') || '{}'); } catch (e) { return {}; } })();
let lang = ['fr','es'].includes(prefs.lang) ? prefs.lang : 'en';
let L = LANGS[lang];
let queue = [], qi = 0, playing = false, holdTimer = null, chunkAbort = false;
let noSet = new Set(), rewireScope = 'all', started = false;
function savePrefs(){ try { localStorage.setItem('rewire-prefs', JSON.stringify({ lang, voice: $('voice').value, rate: +$('rate').value, hold: +$('hold').value })); } catch (e) {} }

/* ================= voices: 2 women + 2 men, clean names ================= */
const MALE_RE = { en: /^(william|guy|ryan|liam|davis|andrew|christopher|eric|jacob|tony|james|mark|david|george|thomas|brandon|connor|steffan|alex|daniel|fred)/i,
                  fr: /^(henri|antoine|jean|claude|paul|thierry|guillaume|nicolas|mathieu|remy|rémy|fabrice|maurice|gerard|gérard|yves|thomas|alain)/i,
                  es: /^(jorge|alvaro|álvaro|alonso|diego|pablo|raul|raúl|enrique|andres|andrés|juan|carlos|miguel|gerardo|liberto|saul|saúl|dario|darío|elias|elías|manuel|hernan|hernán)/i };
const FEMALE_RE = { en: /^(aria|jenny|michelle|sonia|natasha|libby|emma|ava|clara|zira|susan|hazel|heather|samantha|karen|moira|tessa|jane|sara|nancy|amber|monica|olivia|elizabeth|abbi|bella|hollie|maisie|molly|emily|catherine|linda)/i,
                    fr: /^(denise|sylvie|eloise|éloise|charline|celine|céline|julie|caroline|amelie|amélie|hortense|vivienne|jacqueline|brigitte|josephine|joséphine|yvette|coralie|virginie|audrey|marie)/i,
                    es: /^(dalia|paloma|sabina|helena|elvira|esperanza|ximena|camila|sofia|sofía|lucia|lucía|maria|maría|isabela|renata|larissa|vera|abril|andrea|laura|monica|mónica|paulina|yolanda|carlota|catalina|triana)/i };
function cleanName(n){
  return n.replace(/Microsoft |Google |Apple |Online|\(Natural\)|Natural|Desktop|Mobile/gi, '')
          .replace(/[-–—].*$/,'').replace(/\(.*?\)/g,'').replace(/\bfrançais\b|\benglish\b/gi,'').replace(/\s+/g,' ').trim() || n;
}
let voicesReady = false;
function loadVoices(){
  const sel = $('voice'); const all = speechSynthesis.getVoices();
  if (!all.length){
    /* Some phone browsers (Edge on Android) never share their voice list but still
       speak fine — show the default instead of an empty box. */
    if (!sel.options.length){ const o = document.createElement('option'); o.value = ''; o.textContent = L.UI.defaultVoice; sel.appendChild(o); }
    else if (!voicesReady) sel.options[0].textContent = L.UI.defaultVoice;
    return;
  }
  voicesReady = true;
  const pool = all.filter(v => v.lang.toLowerCase().startsWith(lang));
  const use = pool.length ? pool : all;
  const score = v => (/natural/i.test(v.name) ? 8 : 0) + (/neural|online/i.test(v.name) ? 4 : 0) + (/google/i.test(v.name) ? 3 : 0);
  const females = [], males = [], other = [];
  use.forEach(v => {
    const first = cleanName(v.name).split(' ')[0];
    if (FEMALE_RE[lang].test(first)) females.push(v);
    else if (MALE_RE[lang].test(first)) males.push(v);
    else other.push(v);
  });
  females.sort((a, b) => score(b) - score(a));
  males.sort((a, b) => score(b) - score(a));
  if (lang === 'en'){
    const wIdx = males.findIndex(v => /william/i.test(v.name));
    if (wIdx > 0) males.unshift(males.splice(wIdx, 1)[0]);
  }
  const picks = [];
  const seen = new Set();
  /* Phone voices often have no human first name ("English United States", "Google
     Text-to-Speech") — never let a label come out empty. */
  const labelFor = v => {
    const first = cleanName(v.name).split(' ')[0];
    if (first && first.length > 1) return first;
    const full = cleanName(v.name);
    if (full && full.length > 1) return full.slice(0, 28);
    return (v.name || v.lang || 'Voice').slice(0, 28);
  };
  const add = v => { if (!v) return; const label = labelFor(v); if (seen.has(label + '|' + v.name)) return; if ([...seen].some(k => k.split('|')[0] === label)) return; seen.add(label + '|' + v.name); picks.push({ v, label }); };
  add(females[0]); add(males[0]); add(females[1]); add(males[1]);
  other.sort((a, b) => score(b) - score(a));
  while (picks.length < 4 && other.length) add(other.shift());
  if (!picks.length) use.slice(0, 4).forEach(add);
  sel.innerHTML = '';
  picks.slice(0, 4).forEach(p => { const o = document.createElement('option'); o.value = p.v.name; o.textContent = p.label; sel.appendChild(o); });
  if (prefs.voice && picks.find(p => p.v.name === prefs.voice)) sel.value = prefs.voice;
  else if (lang === 'en'){ const w = picks.find(p => /william/i.test(p.v.name)); if (w) sel.value = w.v.name; }
}
if ('speechSynthesis' in window){
  /* Some phones (Samsung especially) deliver the voice list late, never fire
     onvoiceschanged, or hold voices back until the first touch — keep trying. */
  let voiceTries = 0;
  const bootVoices = () => { loadVoices(); if (!voicesReady && voiceTries++ < 30) setTimeout(bootVoices, 400); };
  bootVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
  document.addEventListener('pointerdown', () => { if (!voicesReady) loadVoices(); }, { once: false, passive: true });
}

/* ================= speech engine ================= */
function speakChunks(text, done){
  const parts = text.match(/[^.!?…]+[.!?…]+|[^.!?…]+$/g) || [text];
  chunkAbort = false;
  let i = 0;
  const next = () => {
    if (chunkAbort) return;
    if (i >= parts.length){ done && done(); return; }
    const part = parts[i].trim();
    const u = new SpeechSynthesisUtterance(part);
    const v = speechSynthesis.getVoices().find(x => x.name === $('voice').value);
    if (v) u.voice = v;
    u.lang = lang === 'fr' ? 'fr-CA' : lang === 'es' ? 'es-MX' : 'en-US';
    u.rate = +$('rate').value; u.pitch = 1;
    /* Some browsers (phones especially) report "end" far too early, which made every
       pause start while the voice was still talking. Enforce a realistic floor based
       on text length so timers only start once the audio has truly had time to play. */
    const t0 = Date.now();
    const estMs = Math.max(700, part.length * 60 / (+$('rate').value));
    const finish = () => {
      const remaining = Math.max(320, estMs - (Date.now() - t0));
      i++; setTimeout(next, remaining > 320 ? remaining : 320);
    };
    u.onend = finish;
    u.onerror = finish;
    try { speechSynthesis.resume(); } catch (e) {}
    speechSynthesis.speak(u);
    try { speechSynthesis.resume(); } catch (e) {}
  };
  next();
}
function stopSpeech(){ chunkAbort = true; clearTimeout(holdTimer); speechSynthesis.cancel(); }

/* ================= queue ================= */
function seg(phase, text, opts){ return Object.assign({ phase, text }, opts || {}); }
function buildQueue(){
  queue = [];
  L.OPENING.forEach(t => queue.push(seg(0, t)));
  L.GROUNDING.forEach(t => queue.push(seg(1, t, { breathe: true, hold: 4 })));
  L.HOWTO.forEach(t => queue.push(seg(2, t)));
  L.CATS.forEach((cat, ci) => {
    queue.push(seg(2, cat[0] + '.', { catHeader: true }));
    for (let i = cat[1]; i <= cat[2]; i++) queue.push(seg(2, L.BELIEFS[i][0], { test: i }));
    queue.push(seg(2, '', { recapCat: ci }));
    if (ci < L.CATS.length - 1) L.REGROUND.forEach(t => queue.push(seg(2, t, { breathe: true, hold: 3 })));
  });
  queue.push(seg(3, '', { releaseGate: true }));
  L.REGROUND2.forEach(t => queue.push(seg(3, t, { breathe: true, hold: 4 })));
  L.RELEASE.forEach(t => queue.push(seg(3, t, { breathe: true, hold: 3 })));
  queue.push(seg(4, '', { scopeGate: true }));
  (L.REWIRE_GROUND || []).forEach(t => queue.push(seg(4, t, { breathe: true, hold: 3 })));
  L.REWIRE_INTRO.forEach(t => queue.push(seg(4, t)));
  L.BELIEFS.forEach((b, i) => queue.push(seg(4, b[1], { rewire: i })));
  L.SEALING.forEach(t => queue.push(seg(5, t, { breathe: true, hold: 3 })));
  queue.push(seg(5, '', { end: true }));
}

function renderPhases(){
  const el = $('phases'); el.innerHTML = '';
  L.UI.phases.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'phase'; b.textContent = p;
    b.onclick = () => { if (!started) startSession(); jumpToPhase(i); };
    el.appendChild(b);
  });
}
function markPhase(i){
  [...$('phases').children].forEach((c, k) => { c.classList.toggle('active', k === i); c.classList.toggle('done', k < i); });
}
function renderBeliefList(){
  const el = $('beliefList'); let html = '';
  L.CATS.forEach(c => {
    html += '<div class="belief-cat">' + c[0] + '</div>';
    for (let i = c[1]; i <= c[2]; i++){
      html += '<div class="belief"><div class="t"><span class="n">' + (i + 1) + '</span>' + L.BELIEFS[i][0] + '</div><div class="r">' + L.BELIEFS[i][1] + '</div></div>';
    }
  });
  el.innerHTML = html;
}
function setStage(label, text, sub){
  $('stageLabel').textContent = label; $('spoken').textContent = text; $('stageSub').textContent = sub || '';
}
function updateProgress(){
  const cur = queue[qi];
  if (cur && cur.test !== undefined){
    $('progress').classList.add('show');
    $('progressFill').style.width = ((cur.test + 1) / 50 * 100) + '%';
    const cat = L.CATS.find(c => cur.test >= c[1] && cur.test <= c[2]);
    $('progressText').textContent = L.UI.beliefWord + ' ' + (cur.test + 1) + ' ' + L.UI.ofWord + ' 50 · ' + cat[0] + (noSet.size ? ' · ' + noSet.size + ' ' + L.UI.toRewire : '');
  } else if (cur && cur.rewire !== undefined){
    $('progress').classList.add('show');
    const list = rewireScope === 'no' ? [...noSet] : L.BELIEFS.map((_, i) => i);
    const pos = list.indexOf(cur.rewire) + 1;
    $('progressFill').style.width = (pos / list.length * 100) + '%';
    $('progressText').textContent = L.UI.rewireWord + ' ' + pos + ' ' + L.UI.ofWord + ' ' + list.length;
  } else { $('progress').classList.remove('show'); }
}

/* ================= playback ================= */
function playCurrent(){
  clearTimeout(holdTimer); $('recap').hidden = true; $('choice').classList.remove('show');
  $('breath').hidden = true; $('breath').classList.remove('live');
  if (qi < 0) qi = 0;
  if (qi >= queue.length) qi = queue.length - 1;
  const s = queue[qi];
  markPhase(s.phase); updateProgress();
  $('btnBack').disabled = qi === 0; $('btnNext').disabled = false;

  if (s.recapCat !== undefined){
    stopSpeech();
    const cat = L.CATS[s.recapCat];
    setStage(L.UI.setDoneLabel, L.UI.setDoneText(cat[0]), L.UI.setDoneSub);
    renderRecap(s.recapCat);
    $('recap').hidden = false;
    setTimeout(() => { try { $('recap').scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }, 200);
    const wasPlaying = playing;
    playing = false; $('btnMain').textContent = L.UI.resume;
    if (wasPlaying) speakChunks(L.UI.recapSpoken, null);
    return;
  }
  if (s.releaseGate){
    stopSpeech();
    setStage(L.UI.testDoneLabel, noSet.size ? L.UI.testDoneSome(noSet.size) : L.UI.testDoneNone, L.UI.pressNext);
    playing = false; $('btnMain').textContent = L.UI.resume;
    return;
  }
  if (s.scopeGate){
    stopSpeech();
    setStage(L.UI.chooseLabel, L.UI.chooseText, noSet.size ? '' : L.UI.noBlocksSub);
    const c = $('choice'); c.innerHTML = '';
    const all = document.createElement('button'); all.className = 'btn btn-yes'; all.textContent = L.UI.allBtn;
    all.onclick = () => { stopSpeech(); rewireScope = 'all'; qi++; playing = true; $('btnMain').textContent = L.UI.pause; playCurrent(); };
    c.appendChild(all);
    if (noSet.size){
      const mine = document.createElement('button'); mine.className = 'btn btn-no'; mine.textContent = L.UI.mineBtn(noSet.size);
      mine.onclick = () => { stopSpeech(); rewireScope = 'no'; qi++; playing = true; $('btnMain').textContent = L.UI.pause; playCurrent(); };
      c.appendChild(mine);
    }
    c.classList.add('show');
    const wasPlayingChoice = playing;
    playing = false; $('btnMain').textContent = L.UI.resume;
    if (wasPlayingChoice) speakChunks(L.UI.chooseSpoken, null);
    return;
  }
  if (s.end){
    stopSpeech();
    setStage(L.UI.endLabel, L.UI.endText, L.UI.endSub);
    playing = false; $('btnMain').textContent = L.UI.again; started = false; saveNos();
    $('setup').style.display = '';
    return;
  }
  if (s.rewire !== undefined && rewireScope === 'no' && !noSet.has(s.rewire)){ qi++; playCurrent(); return; }

  const label = s.catHeader ? L.UI.catLabel :
    s.test !== undefined ? L.UI.swayLabel :
    s.rewire !== undefined ? L.UI.repeatLabel : L.UI.phases[s.phase];
  setStage(label, s.text, s.test !== undefined ? L.UI.swaySub : (s.rewire !== undefined ? L.UI.repeatSub : ''));
  if (s.breathe){ $('breath').hidden = false; $('breath').classList.add('live'); }
  if (!playing) return;
  speakChunks(s.text, () => {
    if (!playing) return;
    if (s.test !== undefined || s.rewire !== undefined){
      startHold(+$('hold').value);
    } else {
      holdTimer = setTimeout(advance, (s.hold ? s.hold : 1.2) * 1000);
    }
  });
}
function startHold(sec){
  const sub = $('stageSub'); const base = sub.textContent;
  let left = sec;
  const tick = () => {
    if (left <= 0){ sub.textContent = base; advance(); return; }
    sub.textContent = (base ? base + '   ' : '') + '· ' + left + ' ·';
    left--;
    holdTimer = setTimeout(tick, 1000);
  };
  tick();
}
function advance(){ if (qi < queue.length - 1){ qi++; playCurrent(); } }
function jumpToPhase(i){
  stopSpeech();
  qi = queue.findIndex(s => s.phase === i);
  if (qi < 0) qi = 0;
  playing = true; $('btnMain').textContent = L.UI.pause;
  playCurrent();
}
function startSession(){
  buildQueue(); started = true; qi = 0; playing = true;
  $('setup').style.display = 'none';
  $('btnMain').textContent = L.UI.pause;
  savePrefs();
  playCurrent();
}
function renderRecap(ci){
  const cat = L.CATS[ci]; const el = $('recapList'); el.innerHTML = '';
  $('recapTitle').textContent = cat[0] + L.UI.recapTitleSuffix;
  for (let i = cat[1]; i <= cat[2]; i++){
    const row = document.createElement('div'); row.className = 'recap-row';
    const setState = () => {
      const isNo = noSet.has(i);
      row.innerHTML = '<span class="num">' + (i + 1) + '</span><span class="txt">' + L.BELIEFS[i][0] + '</span><span class="recap-state ' + (isNo ? 'no' : 'yes') + '">' + (isNo ? L.UI.recapBack : L.UI.recapForward) + '</span>';
    };
    setState();
    row.onclick = () => { if (noSet.has(i)) noSet.delete(i); else noSet.add(i); saveNos(); setState(); };
    el.appendChild(row);
  }
}

/* ================= events ================= */
$('btnMain').onclick = () => {
  if (!started){ noSet = new Set(); saveNos(); startSession(); return; }
  if (playing){ playing = false; stopSpeech(); $('btnMain').textContent = L.UI.resume; }
  else { stopSpeech(); playing = true; $('btnMain').textContent = L.UI.pause; playCurrent(); }
};
$('btnNext').onclick = () => { stopSpeech(); advance(); };
$('btnBack').onclick = () => { stopSpeech(); if (qi > 0){ qi--; } playCurrent(); };
$('recapDone').onclick = () => { stopSpeech(); $('recap').hidden = true; qi++; playing = true; $('btnMain').textContent = L.UI.pause; playCurrent(); };
$('langSel').onchange = () => {
  lang = ['fr','es'].includes($('langSel').value) ? $('langSel').value : 'en';
  stopSpeech(); started = false; playing = false; queue = []; qi = 0;
  $('setup').style.display = ''; $('recap').hidden = true; $('progress').classList.remove('show');
  applyLang(); savePrefs();
};
$('testVoice').onclick = () => {
  try { speechSynthesis.cancel(); speechSynthesis.resume(); } catch (e) {}
  const u = new SpeechSynthesisUtterance(L.UI.testLine);
  const v = speechSynthesis.getVoices().find(x => x.name === $('voice').value);
  if (v) u.voice = v;
  u.lang = lang === 'fr' ? 'fr-CA' : lang === 'es' ? 'es-MX' : 'en-US';
  u.rate = +$('rate').value;
  try { speechSynthesis.resume(); } catch (e) {}
  speechSynthesis.speak(u);
  try { speechSynthesis.resume(); } catch (e) {}
};
$('rate').oninput = () => { $('rateVal').textContent = (+$('rate').value).toFixed(2) + '×'; savePrefs(); };
$('hold').oninput = () => { $('holdVal').textContent = $('hold').value + ' s'; savePrefs(); };
$('voice').onchange = savePrefs;
if (prefs.rate){ $('rate').value = prefs.rate; $('rateVal').textContent = (+prefs.rate).toFixed(2) + '×'; }
if (prefs.hold){ $('hold').value = prefs.hold; $('holdVal').textContent = prefs.hold + ' s'; }
window.addEventListener('beforeunload', stopSpeech);
document.addEventListener('visibilitychange', () => { if (document.hidden){ playing = false; stopSpeech(); if (started) $('btnMain').textContent = L.UI.resume; } });

applyLang();
</script>

</body>
